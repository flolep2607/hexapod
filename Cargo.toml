[workspace]
resolver = "2"
members = ["crates/hexapod-core", "crates/hexapod-cli", "crates/hexapod-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Dev loop profile: still optimised enough for the sim to run at speed, but
# without the LTO / single-codegen-unit link that makes release rebuilds slow.
[profile.dev-fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
incremental = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
